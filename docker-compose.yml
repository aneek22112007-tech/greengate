# One command for Flagsmith and the news reader.
# The Flagsmith project name matches the stack started from flagsmith/.
name: flagsmith
# Both files are merged as one include. Listing them as two includes, or redefining
# their services here, makes Compose fail with "conflicts with imported resource".
include:
  - path:
      - flagsmith/docker-compose.yml
      - flagsmith/docker-compose.override.yml

services:
  demo:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: development
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      FLAGSMITH_EVENTS_URL: http://flagsmith:8000/api/
      GREENGATE_DEFAULT_ZONE: IN-SO
    env_file:
      - path: .env
        required: false
    depends_on:
      flagsmith:
        condition: service_started
